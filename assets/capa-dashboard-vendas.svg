<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard de Vendas — Projeto de Portfólio</title>
  <desc id="desc">Capa do projeto com KPIs, evolução anual e ranking dos vendedores.</desc>
  <rect width="1600" height="900" fill="#f6f8fb"/>
  <rect width="1600" height="185" fill="#1e3a5f"/>
  <text x="88" y="70" fill="#9dc7f5" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">PROJETO DE PORTFÓLIO</text>
  <text x="86" y="125" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="44" font-weight="700">Dashboard de Vendas</text>
  <text x="90" y="160" fill="#d9e6f5" font-family="Segoe UI, Arial, sans-serif" font-size="21">Análise comercial com Excel + IA · 2015–2017</text>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(88 228)"><rect width="338" height="146" fill="#fff"/><text x="22" y="28" fill="#687386" font-size="13" font-weight="700">FATURAMENTO</text><text x="22" y="81" fill="#172033" font-size="31" font-weight="700">R$ 4,996 mi</text><text x="22" y="117" fill="#687386" font-size="14">Receita bruta registrada</text></g>
    <g transform="translate(456 228)"><rect width="338" height="146" fill="#fff"/><text x="22" y="28" fill="#687386" font-size="13" font-weight="700">VENDAS</text><text x="22" y="81" fill="#172033" font-size="31" font-weight="700">958</text><text x="22" y="117" fill="#687386" font-size="14">Transações na base</text></g>
    <g transform="translate(824 228)"><rect width="338" height="146" fill="#fff"/><text x="22" y="28" fill="#687386" font-size="13" font-weight="700">TICKET MÉDIO</text><text x="22" y="81" fill="#172033" font-size="31" font-weight="700">R$ 5.215</text><text x="22" y="117" fill="#687386" font-size="14">Faturamento ÷ vendas</text></g>
    <g transform="translate(1192 228)"><rect width="320" height="146" fill="#fff"/><text x="22" y="28" fill="#687386" font-size="13" font-weight="700">CRESCIMENTO 2017</text><text x="22" y="81" fill="#172033" font-size="31" font-weight="700">+16,3%</text><text x="22" y="117" fill="#687386" font-size="14">Comparado a 2016</text></g>
    <rect x="88" y="410" width="855" height="408" fill="#fff"/>
    <text x="116" y="447" fill="#172033" font-size="22" font-weight="700">Evolução anual do faturamento</text>
    <text x="116" y="476" fill="#687386" font-size="14">Receita anual em R$ milhões</text>
    <line x1="142" y1="744" x2="900" y2="744" stroke="#ccd5e1" stroke-width="2"/>
    <rect x="192" y="565" width="114" height="179" rx="3" fill="#2476d3"/><text x="175" y="550" fill="#1e3a5f" font-size="16" font-weight="700">R$ 1,53 mi</text><text x="222" y="776" fill="#687386" font-size="17" font-weight="700">2015</text>
    <rect x="420" y="556" width="114" height="188" rx="3" fill="#2476d3"/><text x="403" y="541" fill="#1e3a5f" font-size="16" font-weight="700">R$ 1,60 mi</text><text x="450" y="776" fill="#687386" font-size="17" font-weight="700">2016</text>
    <rect x="648" y="525" width="114" height="219" rx="3" fill="#2476d3"/><text x="631" y="510" fill="#1e3a5f" font-size="16" font-weight="700">R$ 1,86 mi</text><text x="678" y="776" fill="#687386" font-size="17" font-weight="700">2017</text>
    <text x="116" y="800" fill="#465267" font-size="15">2017 atingiu o maior faturamento do período analisado.</text>
    <rect x="972" y="410" width="540" height="408" fill="#fff"/>
    <text x="1000" y="447" fill="#172033" font-size="22" font-weight="700">Top 5 vendedores</text>
    <text x="1000" y="476" fill="#687386" font-size="14">Faturamento acumulado (R$ mil)</text>
    <g fill="#465267" font-size="16"><text x="1002" y="526">1. Elisabeth</text><text x="1002" y="579">2. Maria</text><text x="1002" y="632">3. Alberto</text><text x="1002" y="685">4. Rogéria</text><text x="1002" y="738">5. Roberto</text></g>
    <g fill="#eaf0f7"><rect x="1130" y="511" width="250" height="16"/><rect x="1130" y="564" width="250" height="16"/><rect x="1130" y="617" width="250" height="16"/><rect x="1130" y="670" width="250" height="16"/><rect x="1130" y="723" width="250" height="16"/></g>
    <g fill="#0f9d8a"><rect x="1130" y="511" width="239" height="16"/><rect x="1130" y="564" width="238" height="16"/><rect x="1130" y="617" width="237" height="16"/><rect x="1130" y="670" width="213" height="16"/><rect x="1130" y="723" width="212" height="16"/></g>
    <g fill="#465267" font-size="14" font-weight="700"><text x="1392" y="525">R$ 573,2 mil</text><text x="1392" y="578">R$ 571,5 mil</text><text x="1392" y="631">R$ 569,3 mil</text><text x="1392" y="684">R$ 511,4 mil</text><text x="1392" y="737">R$ 509,4 mil</text></g>
    <text x="1002" y="781" fill="#2476d3" font-size="15" font-weight="700">Filtros, ranking, sazonalidade e matriz anual</text>
  </g>
</svg>
